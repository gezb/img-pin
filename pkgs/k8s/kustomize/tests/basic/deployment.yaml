apiVersion: apps/v1
kind: Deployment
metadata:
  name: basic
spec:
  selector:
    matchLabels:
      app: basic
  template:
    metadata:
      labels:
        app: basic
    spec:
      initContainers:
      - name: myinit
        image: docker.io/busybox:1.0
      containers:
        - name: app
          image: my-reg.com/nginx:1.27
